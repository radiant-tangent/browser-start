<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Start</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:        #f5f4f0;
  --surface:   #ffffff;
  --surface2:  #eeede9;
  --border:    rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.15);
  --text:      #1c1c1a;
  --text-2:    #888880;
  --text-3:    #bbb;
  --accent:    #1c1c1a;
  --danger:    #c0392b;
  --r:         14px;
  --r-sm:      8px;
  --shadow:    0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #141413;
    --surface:   #1e1e1c;
    --surface2:  #272725;
    --border:    rgba(255,255,255,0.07);
    --border-md: rgba(255,255,255,0.14);
    --text:      #eeeee8;
    --text-2:    #77776e;
    --text-3:    #444;
    --accent:    #eeeee8;
    --shadow:    0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  }
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html, body {
  min-height:100vh;
  background:var(--bg);
  font-family:'DM Sans', system-ui, sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
body {
  display:flex; flex-direction:column;
  align-items:center;
  min-height:100vh; margin:0;
  padding:0 1.5rem;
}

/* ── Layout sections ── */
.header {
  position:sticky; top:0; z-index:50;
  width:100%; display:flex; justify-content:center;
  padding:1.25rem 0 1rem;
  background:var(--bg);
}
.content {
  flex:1; display:flex; align-items:center; justify-content:center;
  width:100%; padding:1rem 0;
}
.footer {
  position:sticky; bottom:0; z-index:50;
  width:100%; display:flex; justify-content:center;
  padding:1rem 0 1.25rem;
  background:var(--bg);
}

/* ── Grid ── */
#grid {
  display:grid;
  grid-template-columns:repeat(auto-fill, 108px);
  gap:18px; justify-content:center;
  max-width:860px; width:100%;
}

/* ── Tile ── */
.tile {
  display:flex; flex-direction:column;
  align-items:center; gap:10px;
  text-decoration:none; color:var(--text);
  cursor:pointer; position:relative;
  outline:none; user-select:none;
  padding:4px; border-radius:var(--r);
  transition:transform 0.13s ease;
}
.tile:hover  { transform:translateY(-2px); }
.tile:active { transform:translateY(0); }
.tile:focus-visible { outline:2px solid var(--text); outline-offset:2px; }

.tile-img {
  width:64px; height:64px; border-radius:14px;
  object-fit:contain; display:block;
  background:var(--surface2);
  box-shadow:var(--shadow);
  transition:box-shadow 0.13s ease;
  image-rendering:-webkit-optimize-contrast;
  image-rendering:crisp-edges;
}
.tile:hover .tile-img { box-shadow:0 4px 18px rgba(0,0,0,0.12); }

.tile-fallback {
  width:64px; height:64px; border-radius:14px;
  background:var(--surface); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; font-weight:500; color:var(--text-2);
  text-transform:uppercase; flex-shrink:0;
  transition:box-shadow 0.13s ease;
}
.tile:hover .tile-fallback { box-shadow:0 4px 18px rgba(0,0,0,0.12); }

.tile-label {
  font-size:11.5px; font-weight:400; color:var(--text-2);
  max-width:100px; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1;
}

/* Add tile */
.tile-add .tile-fallback {
  background:transparent;
  border:1.5px dashed var(--border-md);
  box-shadow:none; color:var(--text-3); font-size:26px;
  transition:background 0.13s, border-color 0.13s, box-shadow 0.13s;
}
.tile-add:hover .tile-fallback { background:var(--surface); border-style:solid; box-shadow:var(--shadow); }
.tile-add .tile-label { color:var(--text-3); }

/* Delete btn */
.del-btn {
  display:none; position:absolute; top:-4px; right:8px;
  width:20px; height:20px; border-radius:50%;
  background:rgba(20,20,18,0.7); color:#fff;
  font-size:13px; line-height:20px; text-align:center;
  cursor:pointer; z-index:5; border:none; font-family:inherit;
}
body.editing .tile:not(.tile-add) .del-btn { display:block; }
body.editing .tile:not(.tile-add) { animation:wobble 0.45s ease infinite alternate; cursor:grab; }
body.editing .tile:not(.tile-add):active { cursor:grabbing; }
body.editing .tile.dragging { opacity:0.4; animation:none; }
body.editing .tile.drag-over { transform:scale(1.05); animation:none; }
@keyframes wobble {
  from { transform:rotate(-1deg); }
  to   { transform:rotate( 1deg); }
}

/* ── Toolbar ── */
.toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }

.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; font-family:inherit; font-size:12.5px; font-weight:400;
  border:0.5px solid var(--border-md); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text-2); cursor:pointer;
  transition:background 0.12s, color 0.12s; box-shadow:var(--shadow);
  white-space:nowrap;
}
.btn:hover { background:var(--surface2); color:var(--text); }
.btn svg { flex-shrink:0; }
.btn-primary { background:var(--accent); color:var(--bg); border-color:transparent; }
.btn-primary:hover { opacity:0.82; background:var(--accent); color:var(--bg); }
.btn-danger { color:var(--danger); }
.btn-danger:hover { background:rgba(192,57,43,0.08); color:var(--danger); }

/* ── Profile dropdown ── */
.profile-wrap { position:relative; }

.profile-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 12px; font-family:inherit; font-size:12.5px; font-weight:400;
  border:0.5px solid var(--border-md); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text); cursor:pointer;
  transition:background 0.12s; box-shadow:var(--shadow);
  white-space:nowrap; max-width:160px;
}
.profile-btn:hover { background:var(--surface2); }
.profile-btn .caret { margin-left:2px; opacity:0.5; font-size:10px; transition:transform 0.15s; }
.profile-wrap.open .caret { transform:rotate(180deg); }
.profile-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.profile-menu {
  display:none; position:absolute; bottom:calc(100% + 6px); left:0;
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r); box-shadow:0 8px 32px rgba(0,0,0,0.14);
  min-width:190px; z-index:100; overflow:hidden;
  padding:4px 0;
}
.profile-wrap.open .profile-menu { display:block; }

.pm-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; font-size:13px; cursor:pointer;
  color:var(--text-2); transition:background 0.1s;
  white-space:nowrap;
}
.pm-item:hover { background:var(--surface2); color:var(--text); }
.pm-item.active { color:var(--text); font-weight:500; }
.pm-item .pm-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--text-3); flex-shrink:0;
}
.pm-item.active .pm-dot { background:var(--text); }
.pm-item .pm-label { flex:1; overflow:hidden; text-overflow:ellipsis; }
.pm-item .pm-actions { display:flex; gap:2px; opacity:0; transition:opacity 0.1s; }
.pm-item:hover .pm-actions { opacity:1; }
.pm-item .pm-del, .pm-item .pm-rename {
  font-size:14px; line-height:1; color:var(--text-3);
  padding:2px 3px; border:none; background:none; cursor:pointer;
  font-family:inherit; transition:color 0.1s; border-radius:4px;
}
.pm-item .pm-del:hover { color:var(--danger); }
.pm-item .pm-rename:hover { color:var(--text); }

.pm-divider { height:0.5px; background:var(--border); margin:4px 0; }

.pm-new {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; font-size:13px; cursor:pointer;
  color:var(--text-2); transition:background 0.1s;
}
.pm-new:hover { background:var(--surface2); color:var(--text); }
.pm-new-icon { font-size:16px; line-height:1; }

/* ── Modals ── */
#backdrop, #rename-backdrop {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.38);
  align-items:center; justify-content:center; z-index:200;
}
#backdrop.open, #rename-backdrop.open { display:flex; }

.modal {
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:16px; padding:1.5rem 1.75rem 1.75rem;
  width:min(360px,92vw); display:flex; flex-direction:column; gap:14px;
  box-shadow:0 8px 40px rgba(0,0,0,0.18);
}
.modal h2 { font-size:15px; font-weight:500; }
.modal label { font-size:11.5px; color:var(--text-2); display:block; margin-bottom:4px; }
.modal input[type=text], .modal input[type=url] {
  width:100%; padding:8px 10px;
  font-family:inherit; font-size:13.5px;
  border:0.5px solid var(--border-md); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--text); outline:none;
  transition:border-color 0.12s;
}
.modal input:focus { border-color:var(--text); }
.icon-row { display:flex; gap:8px; align-items:center; }
.icon-row input { flex:1; }
.icon-preview {
  width:42px; height:42px; border-radius:10px; overflow:hidden;
  flex-shrink:0; border:0.5px solid var(--border);
  background:var(--surface2); display:flex; align-items:center; justify-content:center;
}
.icon-preview img { width:100%; height:100%; object-fit:contain; display:block; }
.modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:2px; }


/* ── Toast ── */
#toast {
  position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%);
  background:var(--accent); color:var(--bg);
  font-size:13px; padding:8px 20px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity 0.2s; z-index:500;
  white-space:nowrap;
}
#toast.show { opacity:1; }

#file-import { display:none; }

/* ── Network split button ── */
.net-split { display:inline-flex; }
.net-split .btn-l { border-radius:var(--r-sm) 0 0 var(--r-sm); border-right:none; }
.net-split .btn-r { border-radius:0 var(--r-sm) var(--r-sm) 0; padding:7px 9px; font-size:10px; border-left:0.5px solid var(--border); }
.pill {
  width:26px; height:15px; border-radius:99px;
  background:var(--text-3); position:relative; flex-shrink:0; transition:background 0.2s;
}
.pill::after {
  content:''; position:absolute; top:2px; left:2px;
  width:11px; height:11px; border-radius:50%;
  background:#fff; transition:left 0.18s;
}
.pill.on { background:#6ee7b7; }
.pill.on::after { left:13px; }

/* ── Network map panel ── */
#net-panel {
  display:none; position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:min(500px, 96vw);
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r) var(--r) 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.12);
  z-index:150;
}
#net-panel.open { display:block; }
.net-panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:0.5px solid var(--border);
}
.net-panel-title { font-size:13px; font-weight:500; }
.net-panel-sub { font-size:11px; color:var(--text-2); margin-top:2px; }
.net-panel-close {
  font-size:18px; line-height:1; color:var(--text-3); cursor:pointer;
  background:none; border:none; font-family:inherit; padding:0 2px;
}
.net-panel-close:hover { color:var(--text); }
.net-rows { max-height:260px; overflow-y:auto; }
.net-row {
  display:grid; grid-template-columns:1fr 20px 1fr 28px;
  gap:8px; align-items:center; padding:9px 16px;
  border-bottom:0.5px solid var(--border);
}
.net-inp {
  width:100%; padding:6px 8px; font-size:12px; font-family:monospace;
  border:0.5px solid var(--border-md); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--text); outline:none;
  transition:border-color 0.12s;
}
.net-inp:focus { border-color:var(--text); }
.net-arrow { font-size:11px; color:var(--text-3); text-align:center; }
.net-del {
  font-size:15px; color:var(--text-3); text-align:center; cursor:pointer;
  background:none; border:none; font-family:inherit; line-height:1;
}
.net-del:hover { color:var(--danger); }
.net-add-row {
  padding:10px 16px; display:flex; align-items:center; gap:6px;
  font-size:12.5px; color:var(--text-2); cursor:pointer;
  border-top:0.5px solid var(--border);
}
.net-add-row:hover { color:var(--text); }

@keyframes fadein {
  from { opacity:0; transform:translateY(6px); }
  to   { opacity:1; transform:translateY(0); }
}
.tile { animation:fadein 0.22s ease both; }
body.no-animations .tile { animation:none !important; }

.theme-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; font-size:13px; cursor:pointer;
  color:var(--text-2); transition:background 0.1s; white-space:nowrap;
}
.theme-item:hover { background:var(--surface2); color:var(--text); }
.theme-item.active { color:var(--text); font-weight:500; }
.theme-swatch {
  width:14px; height:14px; border-radius:50%;
  border:1.5px solid var(--border-md); flex-shrink:0;
}
.theme-divider { height:0.5px; background:var(--border); margin:6px 0; }
.theme-colors {
  display:grid; grid-template-columns:1fr 1fr; gap:6px;
  padding:6px 14px;
}
.theme-color-field {
  display:flex; align-items:center; gap:6px;
}
.theme-color-field label {
  font-size:11px; color:var(--text-2); white-space:nowrap; min-width:50px;
}
.theme-color-field input[type=color] {
  -webkit-appearance:none; appearance:none;
  width:26px; height:26px; border:1.5px solid var(--border-md);
  border-radius:6px; cursor:pointer; padding:2px; background:var(--surface2);
}
.theme-color-field input[type=color]::-webkit-color-swatch-wrapper { padding:0; }
.theme-color-field input[type=color]::-webkit-color-swatch { border:none; border-radius:4px; }

/* ── Search bar ── */
.search-wrap {
  display:flex; align-items:center; gap:0;
  max-width:560px; width:100%;
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r); box-shadow:var(--shadow);
  transition:border-color 0.12s;
}
.search-wrap:focus-within { border-color:var(--text-2); }
.search-input {
  flex:1; padding:12px 16px; font-family:inherit; font-size:14px;
  border:none; background:transparent; color:var(--text); outline:none;
}
.search-input::placeholder { color:var(--text-3); }
.search-provider-btn {
  display:flex; align-items:center; gap:4px;
  padding:8px 12px; font-family:inherit; font-size:11.5px; font-weight:400;
  background:var(--surface2); color:var(--text-2); border:none;
  border-left:0.5px solid var(--border); cursor:pointer;
  white-space:nowrap; transition:color 0.12s;
}
.search-provider-btn:hover { color:var(--text); }
.search-provider-btn .caret { font-size:9px; opacity:0.5; }
.search-provider-menu {
  display:none; position:absolute; top:calc(100% + 6px); right:0;
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r); box-shadow:0 8px 32px rgba(0,0,0,0.14);
  min-width:180px; z-index:100; overflow:hidden; padding:4px 0;
}
.search-provider-wrap { position:relative; }
.search-provider-wrap.open .search-provider-menu { display:block; }
.sp-item {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; font-size:13px; cursor:pointer;
  color:var(--text-2); transition:background 0.1s; white-space:nowrap;
}
.sp-item:hover { background:var(--surface2); color:var(--text); }
.sp-item.active { color:var(--text); font-weight:500; }
.sp-divider { height:0.5px; background:var(--border); margin:4px 0; }
.sp-manage {
  display:flex; align-items:center; gap:6px;
  padding:8px 14px; font-size:12px; cursor:pointer;
  color:var(--text-3); transition:color 0.1s;
}
.sp-manage:hover { color:var(--text); }

/* ── Search providers panel ── */
#search-panel {
  display:none; position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:min(500px, 96vw);
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r) var(--r) 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.12); z-index:150;
}
#search-panel.open { display:block; }
.sp-panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:0.5px solid var(--border);
}
.sp-panel-title { font-size:13px; font-weight:500; }
.sp-panel-close {
  font-size:18px; line-height:1; color:var(--text-3); cursor:pointer;
  background:none; border:none; font-family:inherit; padding:0 2px;
}
.sp-panel-close:hover { color:var(--text); }
.sp-rows { max-height:260px; overflow-y:auto; }
.sp-row {
  display:grid; grid-template-columns:20px 100px 1fr 28px;
  gap:8px; align-items:center; padding:9px 16px;
  border-bottom:0.5px solid var(--border);
}
.sp-inp {
  width:100%; padding:6px 8px; font-size:12px; font-family:monospace;
  border:0.5px solid var(--border-md); border-radius:var(--r-sm);
  background:var(--surface2); color:var(--text); outline:none;
  transition:border-color 0.12s;
}
.sp-inp:focus { border-color:var(--text); }
.sp-del {
  font-size:15px; color:var(--text-3); text-align:center; cursor:pointer;
  background:none; border:none; font-family:inherit; line-height:1;
}
.sp-del:hover { color:var(--danger); }
.sp-add-row {
  padding:10px 16px; display:flex; align-items:center; gap:6px;
  font-size:12.5px; color:var(--text-2); cursor:pointer;
  border-top:0.5px solid var(--border);
}
.sp-add-row:hover { color:var(--text); }

/* ── Settings panel ── */
#settings-panel {
  display:none; position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:min(500px, 96vw);
  background:var(--surface); border:0.5px solid var(--border-md);
  border-radius:var(--r) var(--r) 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.12); z-index:150;
}
#settings-panel.open { display:block; }
.settings-panel-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; border-bottom:0.5px solid var(--border);
}
.settings-panel-title { font-size:13px; font-weight:500; }
.settings-panel-close {
  font-size:18px; line-height:1; color:var(--text-3); cursor:pointer;
  background:none; border:none; font-family:inherit; padding:0 2px;
}
.settings-panel-close:hover { color:var(--text); }
.settings-panel-body { padding:8px 0; max-height:400px; overflow-y:auto; }
.settings-row {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; font-size:13px; color:var(--text-2);
}
.settings-label { flex:1; }
.settings-toggle-switch {
  width:28px; height:16px; border-radius:99px; position:relative;
  background:var(--text-3); transition:background 0.2s; cursor:pointer;
}
.settings-toggle-switch::after {
  content:''; position:absolute; top:2px; left:2px;
  width:12px; height:12px; border-radius:50%;
  background:#fff; transition:left 0.18s;
}
.settings-toggle-switch.on { background:var(--accent); }
.settings-toggle-switch.on::after { left:14px; }
.settings-divider { height:0.5px; background:var(--border); margin:6px 0; }
.settings-section-title { padding:8px 16px 4px; font-size:11.5px; color:var(--text-3); font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
.settings-actions { display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px; }
</style>
</head>
<body>

<div class="header">
<form id="search-form" class="search-wrap" autocomplete="off">
  <input id="search-input" class="search-input" type="text" placeholder="Search…" autofocus/>
  <div class="search-provider-wrap" id="sp-wrap">
    <button type="button" class="search-provider-btn" id="sp-btn">
      <span id="sp-label">DuckDuckGo</span>
      <span class="caret">▾</span>
    </button>
    <div class="search-provider-menu" id="sp-menu" role="menu"></div>
  </div>
</form>
</div>

<div class="content">
<div id="grid" role="list" aria-label="Shortcuts"></div>
</div>

<div class="footer">
<div class="toolbar">

  <!-- Profile picker -->
  <div class="profile-wrap" id="profile-wrap">
    <button class="profile-btn" id="profile-btn" aria-haspopup="true" aria-expanded="false">

<script>
/* ═══════════════════════════════════════════════════════
   Start Page — Application Logic
   ─────────────────────────────────────────────────────
   Sections:
     1. Utilities (toast, slugify, export helper)
     2. Storage (load/save localStorage)
     3. State (store, active profile, nextId)
     4. Network map (rewrite logic + panel UI)
     5. Theme system (per-profile color schemes)
     6. Rendering (grid, tiles, profile menu)
     7. Profile management (switch, create, rename, delete)
     8. Tile modal (add/edit shortcuts)
     9. Edit mode
    10. Import / Export
    11. Initialization
═══════════════════════════════════════════════════════ */

/* ══════════════════════════════════════
   1. UTILITIES
══════════════════════════════════════ */

let _tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2800);
}

function slugify(name) {
  return name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').slice(0, 32) || 'profile';
}

function uniqueSlug(base) {
  let s = base, n = 2;
  while (store.profiles[s]) s = base + '-' + (n++);
  return s;
}

function faviconFor(url) {
  try {
    const origin = new URL(url).origin;
    return `https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodeURIComponent(origin)}&size=128`;
  } catch { return ''; }
}

function doExport(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: filename
  });
  a.click(); URL.revokeObjectURL(a.href);
}

/* ══════════════════════════════════════
   2. STORAGE
══════════════════════════════════════ */

const STORE_KEY = 'start_profiles';
const DEFAULT_SLUG = 'default';
const DEFAULT_TILES = [
  { id: 1, name: "DuckDuckGo", url: "https://noai.duckduckgo.com" }
];

let _storageAvailable = true;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    _storageAvailable = false;
    console.warn('localStorage unavailable — changes won\'t persist.', e);
  }
  return null;
}

function saveStore() {
  if (!_storageAvailable) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (e) {
    _storageAvailable = false;
    console.warn('localStorage write failed:', e);
  }
}

/* ══════════════════════════════════════
   3. STATE
══════════════════════════════════════ */

let store = loadStore();
if (!store || !store.profiles || Object.keys(store.profiles).length === 0) {
  store = {
    profiles: {
      [DEFAULT_SLUG]: { name: 'Default', tiles: JSON.parse(JSON.stringify(DEFAULT_TILES)) }
    }
  };
  saveStore();
}

function getUrlProfile() {
  return new URLSearchParams(window.location.search).get('p');
}
function setUrlProfile(slug) {
  const u = new URL(window.location.href);
  u.searchParams.set('p', slug);
  window.history.replaceState(null, '', u.toString());
}

function resolveActiveSlug() {
  const param = getUrlProfile();
  if (param && store.profiles[param]) return param;
  const first = Object.keys(store.profiles)[0];
  setUrlProfile(first);
  return first;
}

let activeSlug = resolveActiveSlug();
let nextId = Object.values(store.profiles)
  .flatMap(p => p.tiles)
  .reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
let editingTileId = null;
let renameMode = null;
let renameSlug = null;

function activeProfile() { return store.profiles[activeSlug]; }

/* ══════════════════════════════════════
   4. NETWORK MAP
══════════════════════════════════════ */

function getUrlNet() {
  return new URLSearchParams(window.location.search).get('net') || 'local';
}
function setUrlNet(val) {
  const u = new URL(window.location.href);
  u.searchParams.set('net', val);
  window.history.replaceState(null, '', u.toString());
}

let netMode = getUrlNet();

function netMap() {
  return activeProfile().netMap || (activeProfile().netMap = []);
}

// Initialize from max existing ID to prevent collisions
let netMapNextId = Object.values(store.profiles)
  .flatMap(p => p.netMap || [])
  .reduce((m, pair) => Math.max(m, pair.id || 0), 999) + 1;

function rewriteUrl(url) {
  const map = netMap();
  if (!map.length) return url;
  let result = url;
  for (const pair of map) {
    if (!pair.local || !pair.ts) continue;
    if (netMode === 'local') {
      result = result.split(pair.ts).join(pair.local);
    } else {
      result = result.split(pair.local).join(pair.ts);
    }
  }
  return result;
}

function updateNetButton() {
  const isTS = netMode === 'ts';
  document.getElementById('net-pill').className = 'pill' + (isTS ? ' on' : '');
  document.getElementById('net-label').textContent = isTS ? 'TS' : 'Local';
}

function openNetPanel() {
  renderNetRows();
  netPanel.classList.add('open');
  document.getElementById('btn-net-map').setAttribute('aria-expanded', 'true');
}

function closeNetPanel() {
  netPanel.classList.remove('open');
  document.getElementById('btn-net-map').setAttribute('aria-expanded', 'false');
}

function renderNetRows() {
  const map = netMap();
  const container = document.getElementById('net-rows');
  container.innerHTML = '';
  if (!map.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:14px 16px;font-size:12.5px;color:var(--text-3);text-align:center';
    empty.textContent = 'No address pairs yet';
    container.appendChild(empty);
    return;
  }
  map.forEach(pair => {
    const row = document.createElement('div');
    row.className = 'net-row';
    const localInp = document.createElement('input');
    localInp.className = 'net-inp'; localInp.type = 'text';
    localInp.value = pair.local || ''; localInp.placeholder = '192.168.0.x';
    localInp.addEventListener('change', () => { pair.local = localInp.value.trim(); saveStore(); });
    const arrow = document.createElement('div');
    arrow.className = 'net-arrow'; arrow.textContent = '↔';
    const tsInp = document.createElement('input');
    tsInp.className = 'net-inp'; tsInp.type = 'text';
    tsInp.value = pair.ts || ''; tsInp.placeholder = 'hostname';
    tsInp.addEventListener('change', () => { pair.ts = tsInp.value.trim(); saveStore(); });
    const del = document.createElement('button');
    del.className = 'net-del'; del.textContent = '×';
    del.setAttribute('aria-label', 'Remove pair');
    del.addEventListener('click', () => {
      activeProfile().netMap = netMap().filter(p => p.id !== pair.id);
      saveStore(); renderNetRows();
    });
    row.append(localInp, arrow, tsInp, del);
    container.appendChild(row);
  });
}

const netPanel = document.getElementById('net-panel');

document.getElementById('btn-net-toggle').addEventListener('click', () => {
  netMode = netMode === 'local' ? 'ts' : 'local';
  setUrlNet(netMode);
  updateNetButton();
});

document.getElementById('btn-net-map').addEventListener('click', e => {
  e.stopPropagation();
  netPanel.classList.contains('open') ? closeNetPanel() : openNetPanel();
});

document.getElementById('btn-net-close').addEventListener('click', closeNetPanel);

document.getElementById('btn-net-add').addEventListener('click', () => {
  netMap().push({ id: netMapNextId++, local: '', ts: '' });
  saveStore(); renderNetRows();
  const inputs = document.getElementById('net-rows').querySelectorAll('.net-inp');
  if (inputs.length) inputs[inputs.length - 2].focus();
});

/* ══════════════════════════════════════
   4b. SEARCH PROVIDERS (per-profile)
══════════════════════════════════════ */

const DEFAULT_PROVIDERS = [
  { name: 'DuckDuckGo', url: 'https://noai.duckduckgo.com/?q=%s' },
];

function searchProviders() {
  if (!activeProfile().searchProviders || !activeProfile().searchProviders.length) {
    activeProfile().searchProviders = JSON.parse(JSON.stringify(DEFAULT_PROVIDERS));
    saveStore();
  }
  return activeProfile().searchProviders;
}

function activeSearchIdx() {
  const idx = activeProfile().activeSearchIdx || 0;
  return Math.min(idx, searchProviders().length - 1);
}

function setActiveSearchIdx(idx) {
  activeProfile().activeSearchIdx = idx;
  saveStore();
  tempSearchIdx = null;
  updateSearchLabel();
}

// Temporary override (resets after search or on page load)
let tempSearchIdx = null;

function currentSearchIdx() {
  if (tempSearchIdx !== null && tempSearchIdx < searchProviders().length) return tempSearchIdx;
  return activeSearchIdx();
}

function updateSearchLabel() {
  const providers = searchProviders();
  const idx = currentSearchIdx();
  document.getElementById('sp-label').textContent = providers[idx]?.name || 'Search';
  document.getElementById('search-input').placeholder = 'Search ' + (providers[idx]?.name || '') + '…';
}

// Search form submit
document.getElementById('search-form').addEventListener('submit', e => {
  e.preventDefault();
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const providers = searchProviders();
  const provider = providers[currentSearchIdx()];
  if (!provider) return;
  const url = provider.url.replace('%s', encodeURIComponent(q));
  const target = activeProfile().openNewWindow ? '_blank' : '_self';
  window.open(url, target, target === '_blank' ? 'noopener' : '');
  document.getElementById('search-input').value = '';
  // Reset to default after search
  tempSearchIdx = null;
  updateSearchLabel();
});

// Provider dropdown
const spWrap = document.getElementById('sp-wrap');

function closeSpMenu() {
  spWrap.classList.remove('open');
}

function renderSpMenu() {
  const menu = document.getElementById('sp-menu');
  menu.innerHTML = '';
  const providers = searchProviders();
  const cur = currentSearchIdx();
  providers.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'sp-item' + (i === cur ? ' active' : '');
    item.setAttribute('role', 'menuitem');
    item.textContent = p.name;
    item.addEventListener('click', e => {
      e.stopPropagation();
      tempSearchIdx = i;
      updateSearchLabel();
      closeSpMenu();
    });
    menu.appendChild(item);
  });

  const div = document.createElement('div'); div.className = 'sp-divider';
  menu.appendChild(div);

  const manage = document.createElement('div');
  manage.className = 'sp-manage';
  manage.textContent = '⚙ Manage providers…';
  manage.addEventListener('click', e => {
    e.stopPropagation();
    closeSpMenu();
    openSearchPanel();
  });
  menu.appendChild(manage);
}

document.getElementById('sp-btn').addEventListener('click', e => {
  e.stopPropagation();
  if (spWrap.classList.contains('open')) {
    closeSpMenu();
  } else {
    renderSpMenu();
    spWrap.classList.add('open');
  }
});

// Search providers panel
const searchPanel = document.getElementById('search-panel');

function openSearchPanel() {
  renderSpRows();
  searchPanel.classList.add('open');
}

function closeSearchPanel() {
  searchPanel.classList.remove('open');
}

document.getElementById('btn-sp-close').addEventListener('click', closeSearchPanel);

function renderSpRows() {
  const providers = searchProviders();
  const container = document.getElementById('sp-rows');
  container.innerHTML = '';
  if (!providers.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:14px 16px;font-size:12.5px;color:var(--text-3);text-align:center';
    empty.textContent = 'No providers yet';
    container.appendChild(empty);
    return;
  }
  providers.forEach((provider, i) => {
    const row = document.createElement('div');
    row.className = 'sp-row';
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'sp-default';
    radio.checked = (i === activeSearchIdx());
    radio.style.cssText = 'margin:0;cursor:pointer';
    radio.addEventListener('change', () => { setActiveSearchIdx(i); renderSpRows(); });
    const nameInp = document.createElement('input');
    nameInp.className = 'sp-inp'; nameInp.type = 'text';
    nameInp.value = provider.name || ''; nameInp.placeholder = 'Name';
    nameInp.addEventListener('change', () => { provider.name = nameInp.value.trim(); saveStore(); updateSearchLabel(); });
    const urlInp = document.createElement('input');
    urlInp.className = 'sp-inp'; urlInp.type = 'text';
    urlInp.value = provider.url || ''; urlInp.placeholder = 'https://…?q=%s';
    urlInp.addEventListener('change', () => { provider.url = urlInp.value.trim(); saveStore(); });
    const del = document.createElement('button');
    del.className = 'sp-del'; del.textContent = '×';
    del.setAttribute('aria-label', 'Remove provider');
    del.addEventListener('click', () => {
      activeProfile().searchProviders = providers.filter((_, idx) => idx !== i);
      if (activeSearchIdx() >= searchProviders().length) setActiveSearchIdx(Math.max(0, searchProviders().length - 1));
      saveStore(); renderSpRows(); updateSearchLabel();
    });
    row.append(radio, nameInp, urlInp, del);
    container.appendChild(row);
  });
}

document.getElementById('btn-sp-add').addEventListener('click', () => {
  searchProviders().push({ name: '', url: '' });
  saveStore(); renderSpRows();
  const inputs = document.getElementById('sp-rows').querySelectorAll('.sp-inp');
  if (inputs.length) inputs[inputs.length - 2].focus();
});

/* ══════════════════════════════════════
   5. THEME SYSTEM (per-profile)
══════════════════════════════════════ */

const THEME_PRESETS = {
  light: { bg: '#f5f4f0', surface: '#ffffff', text: '#1c1c1a', muted: '#888880', accent: '#1c1c1a' },
  dark:  { bg: '#141413', surface: '#1e1e1c', text: '#eeeee8', muted: '#77776e', accent: '#eeeee8' },
};

const CUSTOM_DEFAULTS = { bg: '#f5f4f0', surface: '#ffffff', text: '#1c1c1a', muted: '#888880', accent: '#1c1c1a' };

function luminance(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function blendColor(hex1, hex2, t) {
  const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
  const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
  const r = Math.round(r1 + (r2 - r1) * t), g = Math.round(g1 + (g2 - g1) * t), b = Math.round(b1 + (b2 - b1) * t);
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

function deriveVars(c) {
  const isDark = luminance(c.bg) < 0.4;
  return {
    '--bg': c.bg,
    '--surface': c.surface,
    '--surface2': blendColor(c.surface, isDark ? '#ffffff' : '#000000', 0.06),
    '--border': isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.08)',
    '--border-md': isDark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.15)',
    '--text': c.text,
    '--text-2': c.muted,
    '--text-3': blendColor(c.muted, c.bg, 0.45),
    '--accent': c.accent,
    '--shadow': isDark
      ? '0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25)'
      : '0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04)',
  };
}

function getProfileTheme() {
  return activeProfile().theme || 'system';
}

function getProfileColors() {
  return activeProfile().themeColors || { ...CUSTOM_DEFAULTS };
}

function getProfileAnimations() {
  return activeProfile().animations !== false; // default true
}

function applyAnimations(on) {
  document.body.classList.toggle('no-animations', !on);
}

function applyTheme(id, colors) {
  activeProfile().theme = id;
  if (id === 'custom' && colors) activeProfile().themeColors = { ...colors };
  saveStore();
  applyThemeVars(id, id === 'custom' ? (colors || getProfileColors()) : null);
}

function applyThemeVars(id, colors) {
  const root = document.documentElement;
  const allVars = ['--bg', '--surface', '--surface2', '--border', '--border-md', '--text', '--text-2', '--text-3', '--accent', '--shadow'];
  allVars.forEach(v => root.style.removeProperty(v));
  if (id === 'system') return;
  const vars = id === 'custom'
    ? deriveVars(colors || getProfileColors())
    : deriveVars(THEME_PRESETS[id]);
  Object.entries(vars).forEach(([k, v]) => root.style.setProperty(k, v));
}

function renderThemeInSettings(container) {

    { id: 'system', label: 'System', swatch: 'linear-gradient(135deg, #f5f4f0 50%, #141413 50%)' },

  const customItem = document.createElement('div');

  customItem.setAttribute('role', 'menuitem');
  const cSwatch = document.createElement('div');

  const cc = getProfileColors();

  customItem.append(cSwatch, cLabel);

  container.appendChild(customItem);

  if (cur === 'custom') {
    const divider = document.createElement('div');
    divider.className = 'theme-divider';
    container.appendChild(divider);

    const grid = document.createElement('div');
    grid.className = 'theme-colors';
    const fields = [
      { key: 'bg',      label: 'BG' },
      { key: 'surface', label: 'Surface' },
      { key: 'text',    label: 'Text' },
      { key: 'muted',   label: 'Muted' },
      { key: 'accent',  label: 'Accent' },
    ];
    const colors = getProfileColors();
    fields.forEach(f => {
      const wrap = document.createElement('div');

    });
    container.appendChild(grid);
  }
}

function makeTile(tile, idx) {
  const wrap = document.createElement('div');
  wrap.className = 'tile';
  wrap.setAttribute('role', 'listitem');
  wrap.setAttribute('tabindex', '0');
  wrap.style.animationDelay = (idx * 28) + 'ms';

  const src = tile.icon || faviconFor(tile.url);
  if (src) {
    const img = document.createElement('img');
    img.className = 'tile-img';
    img.src = src; img.alt = tile.name; img.loading = 'lazy';
    img.onerror = () => {
      const fb = document.createElement('div');
      fb.className = 'tile-fallback';
      fb.textContent = tile.name[0];
      img.replaceWith(fb);
    };
    // Fall back to letter if icon is too small (would look blurry)
    img.onload = () => {
      if (img.naturalWidth < 48 && !tile.icon) {
        const fb = document.createElement('div');
        fb.className = 'tile-fallback';
        fb.textContent = tile.name[0];
        img.replaceWith(fb);
      }
    };
    wrap.appendChild(img);
  } else {
    const fb = document.createElement('div');
    fb.className = 'tile-fallback';
    fb.textContent = tile.name[0];
    wrap.appendChild(fb);
  }

  const lbl = document.createElement('span');
  lbl.className = 'tile-label'; lbl.textContent = tile.name;
  wrap.appendChild(lbl);

  const del = document.createElement('button');
  del.className = 'del-btn'; del.textContent = '×';
  del.setAttribute('aria-label', `Remove ${tile.name}`);
  del.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    activeProfile().tiles = activeProfile().tiles.filter(t => t.id !== tile.id);
    saveStore(); render();
  });
  wrap.appendChild(del);

  // Drag-and-drop reordering (edit mode only)
  wrap.setAttribute('draggable', 'false');
  wrap.dataset.tileId = tile.id;

  wrap.addEventListener('dragstart', e => {
    if (!document.body.classList.contains('editing')) { e.preventDefault(); return; }
    wrap.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', tile.id);
    dragSrcId = tile.id;
  });
  wrap.addEventListener('dragend', () => {
    wrap.classList.remove('dragging');
    document.querySelectorAll('.tile.drag-over').forEach(el => el.classList.remove('drag-over'));
    dragSrcId = null;
  });
  wrap.addEventListener('dragover', e => {
    if (dragSrcId == null || tile.id === dragSrcId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    wrap.classList.add('drag-over');
  });
  wrap.addEventListener('dragleave', () => {
    wrap.classList.remove('drag-over');
  });
  wrap.addEventListener('drop', e => {
    e.preventDefault();
    wrap.classList.remove('drag-over');
    if (dragSrcId == null || tile.id === dragSrcId) return;
    const tiles = activeProfile().tiles;
    const fromIdx = tiles.findIndex(t => t.id === dragSrcId);
    const toIdx = tiles.findIndex(t => t.id === tile.id);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = tiles.splice(fromIdx, 1);
    tiles.splice(toIdx, 0, moved);
    saveStore(); render();
  });

  wrap.addEventListener('click', () => {
    if (document.body.classList.contains('editing')) openTileModal(tile.id);
    else {
      const target = activeProfile().openNewWindow ? '_blank' : '_self';
      window.open(rewriteUrl(tile.url), target, target === '_blank' ? 'noopener' : '');
    }
  });
  wrap.addEventListener('keydown', e => { if (e.key === 'Enter') wrap.click(); });
  return wrap;
}

let dragSrcId = null;

function render() {
  const p = activeProfile();
  document.title = p.name + ' — Start';
  document.getElementById('profile-name-label').textContent = p.name;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  p.tiles.forEach((tile, i) => grid.appendChild(makeTile(tile, i)));

  // "+ Add" tile
  const add = document.createElement('div');
  add.className = 'tile tile-add';
  add.setAttribute('role', 'button'); add.setAttribute('tabindex', '0');
  add.setAttribute('aria-label', 'Add shortcut');
  add.style.animationDelay = (p.tiles.length * 28) + 'ms';
  const fb = document.createElement('div');
  fb.className = 'tile-fallback'; fb.textContent = '+'; fb.setAttribute('aria-hidden', 'true');
  const lbl = document.createElement('span');
  lbl.className = 'tile-label'; lbl.textContent = 'Add';
  add.append(fb, lbl);
  add.addEventListener('click', () => openTileModal(null));
  add.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openTileModal(null); });
  grid.appendChild(add);
}

function renderProfileMenu() {
  const menu = document.getElementById('profile-menu');
  menu.innerHTML = '';

  Object.entries(store.profiles).forEach(([slug, prof]) => {
    const item = document.createElement('div');
    item.className = 'pm-item' + (slug === activeSlug ? ' active' : '');
    item.setAttribute('role', 'menuitem');

    const dot = document.createElement('span'); dot.className = 'pm-dot';
    const label = document.createElement('span'); label.className = 'pm-label'; label.textContent = prof.name;

    const actions = document.createElement('div');
    actions.className = 'pm-actions';

    const renameBtn = document.createElement('button');
    renameBtn.className = 'pm-rename'; renameBtn.textContent = '✎';
    renameBtn.setAttribute('aria-label', `Rename ${prof.name}`);
    renameBtn.title = 'Rename';
    renameBtn.addEventListener('click', e => {
      e.stopPropagation();
      closeProfileMenu();
      openRenameModal('rename', slug);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'pm-del'; delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', `Delete ${prof.name}`);
    delBtn.title = 'Delete';
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      const slugs = Object.keys(store.profiles);
      if (slugs.length <= 1) { toast("Can't delete the only profile"); return; }
      if (!confirm(`Delete profile "${prof.name}"?`)) return;
      delete store.profiles[slug];
      saveStore();
      if (activeSlug === slug) switchProfile(Object.keys(store.profiles)[0]);
      else renderProfileMenu();
    });

    actions.append(renameBtn, delBtn);
    item.append(dot, label, actions);
    item.addEventListener('click', () => { closeProfileMenu(); switchProfile(slug); });
    menu.appendChild(item);
  });

  const div = document.createElement('div'); div.className = 'pm-divider';
  menu.appendChild(div);

  const newItem = document.createElement('div');
  newItem.className = 'pm-new'; newItem.setAttribute('role', 'menuitem');
  newItem.innerHTML = '<span class="pm-new-icon" aria-hidden="true">+</span><span>New profile</span>';
  newItem.addEventListener('click', () => { closeProfileMenu(); openRenameModal('new'); });
  menu.appendChild(newItem);
}

/* ══════════════════════════════════════
   10. IMPORT / EXPORT
══════════════════════════════════════ */

document.getElementById('file-import').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imp = JSON.parse(ev.target.result);

      // All-profiles format { version:2, profiles:{...} }
      if (imp.version === 2 && imp.profiles && typeof imp.profiles === 'object') {
        const incoming = Object.entries(imp.profiles);
        const conflicts = incoming.filter(([slug]) => store.profiles[slug]);
        const news = incoming.filter(([slug]) => !store.profiles[slug]);
        let msg = 'Import ' + incoming.length + ' profile' + (incoming.length !== 1 ? 's' : '') + '?';
        if (conflicts.length) msg += '\n\nWill overwrite: ' + conflicts.map(([, p]) => '"' + p.name + '"').join(', ') + '.';
        if (news.length) msg += '\n\nWill add new: ' + news.map(([, p]) => '"' + p.name + '"').join(', ') + '.';
        if (!confirm(msg)) return;
        for (const [slug, prof] of incoming) store.profiles[slug] = prof;
        nextId = Object.values(store.profiles)
          .flatMap(p => p.tiles)
          .reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
        saveStore();
        switchProfile(incoming[0][0]);
        renderProfileMenu();
        toast('Imported ' + incoming.length + ' profile' + (incoming.length !== 1 ? 's' : '') + ' ✓');
        return;
      }

      // Single-profile format { profile:{name,tiles,...} } or legacy {tiles:[]}
      let importedProfile;
      if (imp.profile && Array.isArray(imp.profile.tiles)) {
        importedProfile = imp.profile;
      } else if (Array.isArray(imp.tiles)) {
        importedProfile = { name: null, tiles: imp.tiles };
      } else throw new Error('Unrecognised format');

      const importedName = importedProfile.name;
      const importedTiles = importedProfile.tiles;

      // Build a full profile object preserving theme/netMap/animations
      function buildProfile(name, base) {
        const p = { name, tiles: base.tiles };
        if (base.theme) p.theme = base.theme;
        if (base.themeColors) p.themeColors = base.themeColors;
        if (base.openNewWindow !== undefined) p.openNewWindow = base.openNewWindow;
        if (base.animations !== undefined) p.animations = base.animations;
        if (base.netMap) p.netMap = base.netMap;
        if (base.searchProviders) p.searchProviders = base.searchProviders;
        if (base.activeSearchIdx !== undefined) p.activeSearchIdx = base.activeSearchIdx;
        return p;
      }

      if (importedName && importedName !== activeProfile().name) {
        const createNew = confirm(
          'The file contains a profile named "' + importedName + '".\n\n' +
          'OK → add as a new profile\n' +
          'Cancel → overwrite current profile ("' + activeProfile().name + '")'
        );
        if (createNew) {
          const slug = uniqueSlug(slugify(importedName));
          store.profiles[slug] = buildProfile(importedName, importedProfile);
          saveStore(); switchProfile(slug);
          toast('Imported as new profile "' + importedName + '" ✓');
        } else {
          if (!confirm('Overwrite ' + activeProfile().tiles.length + ' shortcut(s) in "' + activeProfile().name + '"?')) return;
          Object.assign(activeProfile(), buildProfile(activeProfile().name, importedProfile));
          nextId = importedTiles.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
          saveStore();
          const t = getProfileTheme();
          applyThemeVars(t, t === 'custom' ? getProfileColors() : null);
          applyAnimations(getProfileAnimations());
          updateSearchLabel();
          render();
          toast('Imported ' + importedTiles.length + ' shortcuts ✓');
        }
      } else {
        const cur = activeProfile().tiles.length;
        const msg = cur > 0
          ? 'Replace ' + cur + ' shortcut' + (cur !== 1 ? 's' : '') + ' in "' + activeProfile().name + '" with ' + importedTiles.length + ' from the file?'
          : 'Import ' + importedTiles.length + ' shortcut' + (importedTiles.length !== 1 ? 's' : '') + ' into "' + activeProfile().name + '"?';
        if (!confirm(msg)) return;
        Object.assign(activeProfile(), buildProfile(activeProfile().name, importedProfile));
        nextId = importedTiles.reduce((m, t) => Math.max(m, t.id || 0), 0) + 1;
        saveStore();
        const t = getProfileTheme();
        applyThemeVars(t, t === 'custom' ? getProfileColors() : null);
        applyAnimations(getProfileAnimations());
        updateSearchLabel();
        render();
        toast('Imported ' + importedTiles.length + ' shortcuts ✓');
      }
    } catch (err) { toast('Import failed: ' + err.message); }
  };
  reader.readAsText(file); e.target.value = '';
});

/* ══════════════════════════════════════
   11. GLOBAL EVENT HANDLERS & INIT
══════════════════════════════════════ */

// Consolidated click-outside handler
document.addEventListener('click', e => {
  if (!profileWrap.contains(e.target)) closeProfileMenu();
  if (!spWrap.contains(e.target)) closeSpMenu();
  if (netPanel.classList.contains('open') && !netPanel.contains(e.target) && e.target !== document.getElementById('btn-net-map'))
    closeNetPanel();
  if (searchPanel.classList.contains('open') && !searchPanel.contains(e.target))
    closeSearchPanel();
  if (settingsPanel.classList.contains('open') && !settingsPanel.contains(e.target) && e.target !== document.getElementById('btn-settings'))
    closeSettingsPanel();
});

// Consolidated escape handler
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeProfileMenu();
    closeSpMenu();
    closeSearchPanel();
    closeSettingsPanel();
    closeTileModal();
    closeRenameModal();
  }
});

// Boot
updateNetButton();
updateSearchLabel();
applyThemeVars(getProfileTheme(), getProfileTheme() === 'custom' ? getProfileColors() : null);
applyAnimations(getProfileAnimations());
render();
</script>
</body>
</html>
